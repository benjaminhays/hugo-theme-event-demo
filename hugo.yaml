            # Open Graph / X (Twitter) Cards
            description: |
                Keene High School's Model United Nations Conference - BirdMUN 2027!
            keywords: ["MUN", "Model United Nations", "Keene High School", "BirdMUN", "Conference", "2027"]
            themes:
                event:
                    slogan: Keene High School's Model United Nations Conference
                    location: Keene, NH 03431, United States
                    description: |
                        Join us for BirdMUN 2027 at Keene High School! Experience engaging debates,
                        crisis response, and collaborative problem-solving with delegates. Build diplomatic skills
                        and make lasting connections.
                    directions: |
                       BirdMUN will be hosted at Keene High School, 43 Arch St., Keene, NH.
                       Delegations should use the main entrance for check-in and follow posted signs to committee rooms.
                       Parking and arrival details will be shared with registered schools before conference day.
                    aboutUs: |
                        BirdMUN is Keene High School's student-led Model United Nations conference.
                        We welcome delegates to practice diplomacy, research global issues, and collaborate in committee.
                        Our team builds an accessible conference for new and experienced MUN students alike.
